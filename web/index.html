<!doctype html>
<html lang="es" data-theme="estudio">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Decibeles</title>
  <meta name="description" content="Medidor de ruido en decibeles: dB(A), dB(C) y dB(Z), espectro, dosis de exposición, semáforo de ruido e historial de sesiones. Funciona sin conexión.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/iconos/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0e0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Decibeles">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Decibeles — medidor de ruido">
  <meta property="og:description" content="Medí el ruido ambiente con tu teléfono. Sin conexión, sin cuentas, sin mandar audio a ningún lado.">
  <meta property="og:image" content="https://decibeles.ip1.cc/iconos/og.png">
  <link rel="preload" href="/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Theme before first paint, so a light theme never flashes dark.
    try {
      var s = JSON.parse(localStorage.getItem('decibeles.settings') || '{}')
      if (s.theme) document.documentElement.dataset.theme = s.theme
    } catch (e) {}
  </script>
  <script type="module" src="/js/main.js"></script>
  <script src="/js/update-check.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M3.5 16.5a8.5 8.5 0 1 1 17 0"/><path d="M12 16.5l4.2-5.2"/><circle cx="12" cy="16.5" r="1.3"/></symbol>
      <symbol id="i-light" viewBox="0 0 24 24"><rect x="7.5" y="2.5" width="9" height="19" rx="4.5"/><circle cx="12" cy="7.2" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="16.8" r="1.6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 5.2v1.6M4 11.2v1.6M4 17.2v1.6"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.8" height="14" rx="1.1" fill="currentColor" stroke="none"/><rect x="13.7" y="5" width="3.8" height="14" rx="1.1" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4.5H9"/></symbol>
      <symbol id="i-hold" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.6 4.4L12 6l2.4-1.6M9.6 19.6L12 18l2.4 1.6"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5.5 21V4"/><path d="M5.5 4.5h11l-2.2 4 2.2 4h-11"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6.5" cy="12" r="2.4"/><circle cx="17.5" cy="6" r="2.4"/><circle cx="17.5" cy="18" r="2.4"/><path d="M8.7 10.8l6.6-3.6M8.7 13.2l6.6 3.6"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4.5M7 9l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
      <symbol id="i-install" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><rect x="4" y="17" width="16" height="4" rx="1.2"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2.5 12h2.5l2-5 3 10 3-14 3 12 2-3h3.5"/></symbol>
    </defs>
  </svg>

  <div class="install-bar" id="install-bar" hidden>
    <span data-text></span>
    <button type="button" class="install-yes" data-install></button>
    <button type="button" class="install-no" data-later></button>
  </div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Decibeles">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 22a11 11 0 0 1 22 0" class="bm-arc"/>
        <path d="M9.5 22a6.5 6.5 0 0 1 13 0" class="bm-arc2"/>
        <path d="M16 22l6-8" class="bm-needle"/>
        <circle cx="16" cy="22" r="2" class="bm-pivot"/>
      </svg>
      <span class="brand-word">Decibeles</span>
    </a>
    <div class="topbar-end">
      <a class="topbtn" href="/night" data-i18n-label="night.title" aria-label="Modo nocturno"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></a>
      <div class="status" id="status" data-state="idle"><i></i><span data-i18n="status.idle">Listo</span></div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Decibeles">
    <a href="/" data-nav="/"><svg class="icon" aria-hidden="true"><use href="#i-gauge"/></svg><span data-i18n="nav.meter">Medidor</span></a>
    <a href="/traffic-light" data-nav="/traffic-light"><svg class="icon" aria-hidden="true"><use href="#i-light"/></svg><span data-i18n="nav.light">Semáforo</span></a>
    <a href="/sessions" data-nav="/sessions"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span data-i18n="nav.sessions">Sesiones</span></a>
    <a href="/settings" data-nav="/settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span data-i18n="nav.settings">Ajustes</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="build-stamp" id="build-stamp" aria-hidden="true"></div>
  <noscript><p style="padding:2rem;color:#fff">Decibeles necesita JavaScript.</p></noscript>
</body>
</html>
